<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MR Club - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        
        <div class="text-center mb-4">
            <h2 class="text-primary fw-bold">MR CLUB</h2>
            <p class="text-muted">Portal de Asociados - Acerías</p>
        </div>

        <form id="formLogin" action="" method="POST">
            
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold text-secondary">Correo Electrónico:</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-control" 
                    placeholder="nombre@correo.com" 
                    required
                >
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold text-secondary">Contraseña:</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="••••••••" 
                    required
                >
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary fw-bold py-2">Ingresar al Sistema</button>
            </div>

            <div class="text-center mt-3">
                <a href="registro.html" class="text-decoration-none small">¿No tienes cuenta? Regístrate aquí</a>
            </div>

        </form>
    </div>

</body>
</html>
